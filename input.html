<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成单录入 - 销售业绩看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:#fff;border-radius:20px;padding:30px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#667eea;margin-bottom:25px;font-size:1.8em}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;font-weight:700;color:#333}
.form-group select,.form-group input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:1em}
.form-group select:focus,.form-group input:focus{border-color:#667eea;outline:none}
.quick-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.quick-btn{padding:10px;background:#f0f0f0;border:2px solid #ddd;border-radius:8px;cursor:pointer;font-weight:700;font-size:.95em;transition:all .2s}
.quick-btn:hover{background:#667eea;color:#fff;border-color:#667eea}
.btn-submit{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:1.2em;font-weight:700;cursor:pointer;margin-top:10px}
.btn-submit:hover{opacity:.9}
.btn-back{display:inline-block;margin-bottom:15px;color:#667eea;text-decoration:none;font-weight:700}
.msg{text-align:center;padding:10px;margin-top:15px;border-radius:8px;display:none}
.msg.success{display:block;background:#d4edda;color:#155724}
.msg.error{display:block;background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="btn-back">← 返回看板</a>
<h1>🎉 成单录入</h1>
<form id="dealForm">
<div class="form-group">
<label>选择小组</label>
<select id="groupName" required>
<option value="">请选择小组</option>
<option value="一组">一组</option>
<option value="二组">二组</option>
<option value="三组">三组</option>
</select>
</div>
<div class="form-group">
<label>业务员姓名</label>
<input type="text" id="salesperson" placeholder="请输入业务员姓名" required>
</div>
<div class="form-group">
<label>成交金额（元）</label>
<input type="number" id="amount" placeholder="请输入金额" min="0.01" step="0.01" required>
<div class="quick-amounts">
<button type="button" class="quick-btn" onclick="setAmount(50000)">5万</button>
<button type="button" class="quick-btn" onclick="setAmount(100000)">10万</button>
<button type="button" class="quick-btn" onclick="setAmount(200000)">20万</button>
<button type="button" class="quick-btn" onclick="setAmount(500000)">50万</button>
</div>
</div>
<button type="submit" class="btn-submit">🎉 提交成单</button>
</form>
<div id="msg" class="msg"></div>
</div>
<script>
function setAmount(v){document.getElementById('amount').value=v}

document.getElementById('dealForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const groupName=document.getElementById('groupName').value;
  const salesperson=document.getElementById('salesperson').value;
  const amount=parseFloat(document.getElementById('amount').value);
  
  if(!groupName||!salesperson||!amount){
    showMsg('请填写所有字段','error');return;
  }
  
  try{
    const resp=await fetch('/api/deal',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({groupName,salesperson,amount})
    });
    const result=await resp.json();
    if(result.success){
      showMsg('🎉 成单录入成功！','success');
      document.getElementById('dealForm').reset();
      // Return to dashboard after 1.5s
      setTimeout(()=>{window.location.href='index.html'},1500);
    }else{
      showMsg('录入失败: '+result.error,'error');
    }
  }catch(e){
    showMsg('网络错误，请重试','error');
  }
});

function showMsg(text,type){
  const msg=document.getElementById('msg');
  msg.textContent=text;
  msg.className='msg '+type;
  setTimeout(()=>{msg.className='msg'},3000);
}
</script>
</body>
</html>
